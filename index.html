<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <title>Орехи и Сухофрукты</title>
  <style>
    :root { --bg: #f6f5f2; --card: #fff; --text: #1f2421; --muted: #6b7280; --accent: #2e7d32; --accent-light: #e8f5e9; --border: #e5e7eb; --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 95px; }
    .header { background: var(--card); padding: 12px 16px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .logo { font-size: 18px; font-weight: 800; color: var(--accent); }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .pill-btn { background: var(--accent-light); color: var(--accent); border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .pill-btn.user { background: #f3f4f6; color: var(--text); }
    .delivery-banner { background: #fff8e1; border-left: 4px solid #ffb300; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: #f9fafb; outline: none; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
    .cat-chip { padding: 6px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--border); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .cat-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .container { max-width: 960px; margin: 0 auto; padding: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 680px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    .card { background: var(--card); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
    .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .card-stock { font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: 600; }
    .card-stock.out { color: #dc2626; }
    .card-desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .variants { display: flex; gap: 6px; margin-bottom: 10px; margin-top: auto; }
    .var-btn { flex: 1; padding: 6px; border: 1px solid var(--border); background: #fff; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .var-btn.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 16px; font-weight: 800; }
    .add-btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .add-btn:disabled { background: #d1d5db; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px; }
    @media (min-width: 600px) { .modal { align-items: center; } .modal-content { border-radius: 24px; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .close-btn { background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .auth-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; font-size: 15px; font-weight: 600; margin-bottom: 10px; cursor: pointer; }
    .auth-btn.max { background: #5a4bda; color: #fff; border: none; }
    .auth-btn.tg { background: #24A1DE; color: #fff; border: none; }
    .auth-btn.vk { background: #0077FF; color: #fff; border: none; }
    .auth-btn.yandex { background: #FC3F1D; color: #fff; border: none; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; }
    .primary-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .cart-bar { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 928px; margin: 0 auto; background: var(--accent); color: #fff; padding: 14px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; box-shadow: 0 8px 20px rgba(46,125,50,0.35); cursor: pointer; z-index: 30; }
    .cart-bar.hidden { display: none; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-weight: 700; cursor: pointer; }
    .status-msg { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="logo">🥜 Орехи и Сухофрукты</div>
    <div class="header-actions">
      <button class="pill-btn" id="groupBadge" onclick="openCart()">Выбрать группу</button>
      <button class="pill-btn user" id="authBadge" onclick="openAuth()">Войти</button>
    </div>
  </div>
  <div class="delivery-banner" id="deliveryBanner">Выберите вашу группу, чтобы увидеть дату выдачи</div>
  <input type="text" class="search-input" id="searchInput" placeholder="Поиск по ассортименту..." oninput="renderProducts()">
  <div class="cats" id="catsBar"></div>
</div>
<div class="container">
  <div id="statusMsg" class="status-msg">Подключаемся к базе данных...</div>
  <div class="grid" id="productsGrid"></div>
</div>
<div class="cart-bar hidden" id="cartBar" onclick="openCart()">
  <span id="cartCount">0 товаров</span>
  <span id="cartTotal">0 ₽ →</span>
</div>

<div class="modal" id="authModal">
  <div class="modal-content">
    <div class="modal-header"><h2>Вход в профиль</h2><button class="close-btn" onclick="closeModal('authModal')">×</button></div>
    <button class="auth-btn max" onclick="loginViaMessenger('MAX')">💬 Войти через MAX</button>
    <button class="auth-btn tg" onclick="loginViaMessenger('Telegram')">✈️ Войти через Telegram</button>
    <button class="auth-btn vk" onclick="loginViaOAuth('vk')">🔵 Войти с VK ID</button>
    <button class="auth-btn yandex" onclick="loginViaOAuth('yandex')">🔴 Войти с Яндекс ID</button>
    <div class="form-group"><input type="tel" class="form-control" id="phoneLoginInput" placeholder="+7 (999) 000-00-00"></div>
    <div class="form-group"><input type="text" class="form-control" id="nameLoginInput" placeholder="Ваше имя"></div>
    <button class="primary-btn" onclick="loginViaPhone()">Продолжить</button>
  </div>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-header"><h2>Ваш заказ</h2><button class="close-btn" onclick="closeModal('cartModal')">×</button></div>
    <div id="cartItemsList"></div>
    <form id="orderForm" onsubmit="submitOrder(event)" style="margin-top:14px;">
      <div class="form-group"><label>Ваша группа выдачи*</label><select class="form-control" id="groupSelect" required onchange="onGroupChange()"></select></div>
      <div class="form-group"><label>Ваше Имя*</label><input type="text" class="form-control" id="clientName" required></div>
      <div class="form-group"><label>Телефон*</label><input type="tel" class="form-control" id="clientPhone" required placeholder="+7 900 000-00-00"></div>
      <div class="form-group"><label>Оплата</label><select class="form-control" id="paymentSelect"><option value="Наличными">Наличными</option><option value="Перевод">Перевод СБП</option></select></div>
      <div class="form-group"><label>Комментарий</label><input type="text" class="form-control" id="clientComment"></div>
      <button type="submit" class="primary-btn" id="submitBtn">Оформить заказ</button>
    </form>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://bhfzkdduwabffqgpcgdt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoZnprZGR1d2FiZmZxZ3BjZ2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1Njg0MTMsImV4cCI6MjExMTE0NDQxM30.cRb2Ba_3yd-uSrKUrccGzYXeTPvV9mMBhkmHSWzAsx8';

  async function sbFetch(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }

  let products = [], groups = [], activeCategory = 'Все', selectedVariants = {}, cart = [];
  let currentUser = JSON.parse(localStorage.getItem('nut_user') || 'null');

  async function syncProfile(userData) {
    const col = userData.telegram_id ? 'telegram_id' : userData.max_id ? 'max_id' : userData.vk_id ? 'vk_id' : 'phone';
    if (!userData[col]) return;
    try {
      const ex = await sbFetch(`profiles?${col}=eq.${encodeURIComponent(userData[col])}&select=*`);
      let p = ex && ex;
      if (!p) {
        const cr = await sbFetch('profiles', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(userData) });
        p = cr && cr;
      }
      if (p) { currentUser = p; localStorage.setItem('nut_user', JSON.stringify(p)); updateUserUI(); }
    } catch (e) {}
  }

  function updateUserUI() {
    if (!currentUser) return;
    document.getElementById('authBadge').textContent = '👤 ' + (currentUser.full_name || currentUser.phone || 'Профиль');
    if (currentUser.full_name) document.getElementById('clientName').value = currentUser.full_name;
    if (currentUser.phone) document.getElementById('clientPhone').value = currentUser.phone;
  }

  async function init() {
    const statusEl = document.getElementById('statusMsg');
    try {
      if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        const u = window.Telegram.WebApp.initDataUnsafe.user;
        await syncProfile({ telegram_id: String(u.id), full_name: `${u.first_name || ''} ${u.last_name || ''}`.trim() });
      } else if (window.WebApp?.initDataUnsafe?.user) {
        const u = window.WebApp.initDataUnsafe.user;
        await syncProfile({ max_id: String(u.id), full_name: `${u.first_name || ''} ${u.last_name || ''}`.trim() });
      }
      updateUserUI();

      const [prods, grps] = await Promise.all([
        sbFetch('products?is_active=eq.true&order=sort_order.asc'),
        sbFetch('pickup_groups?is_active=eq.true')
      ]);
      products = prods || []; groups = grps || [];
      products.forEach(p => { selectedVariants[p.id] = 0; });

      statusEl.style.display = products.length ? 'none' : 'block';
      if (!products.length) statusEl.textContent = 'База подключена, но товаров пока нет.';

      renderCategories(); populateGroups(); renderProducts();
    } catch (err) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `Ошибка базы:<br><small style="color:#dc2626">${err.message}</small>`;
    }
  }

  function renderCategories() {
    const cats = ['Все', ...new Set(products.map(p => p.category))];
    document.getElementById('catsBar').innerHTML = cats.map(c =>
      `<div class="cat-chip ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</div>`
    ).join('');
  }
  function setCategory(c) { activeCategory = c; renderCategories(); renderProducts(); }

  function populateGroups() {
    const sel = document.getElementById('groupSelect');
    sel.innerHTML = '<option value="">-- Выберите группу --</option>' + groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    const ug = new URLSearchParams(window.location.search).get('group') || currentUser?.default_group_id;
    if (ug && groups.some(g => g.id === ug)) sel.value = ug;
    onGroupChange();
  }

  function onGroupChange() {
    const g = groups.find(x => x.id === document.getElementById('groupSelect').value);
    document.getElementById('groupBadge').textContent = g ? g.name : 'Выбрать группу';
    document.getElementById('deliveryBanner').innerHTML = g
      ? `📍 <b>${g.name}</b> (${g.address || ''})<br>Сбор до: <b>${g.collect_until}</b> • Выдача: <b>${g.delivery_date}</b>`
      : '👆 Выберите вашу группу, чтобы увидеть дату выдачи';
  }

  function renderProducts() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const ph = 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="300" height="300" fill="%23e5e7eb"><rect width="300" height="300"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="48">🥜</text></svg>';
    document.getElementById('productsGrid').innerHTML = products
      .filter(p => (activeCategory === 'Все' || p.category === activeCategory) && (p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)))
      .map(p => {
        const vi = selectedVariants[p.id] || 0, v = p.variants[vi], ok = Number(p.stock_kg) > 0;
        return `<div class="card"><img class="card-img" src="${p.image_url || ph}" loading="lazy"><div class="card-body">
          <div class="card-title">${p.name}</div>
          <div class="card-stock ${ok ? '' : 'out'}">${ok ? `В наличии: ${p.stock_kg} кг` : 'Нет в наличии'}</div>
          <div class="card-desc">${p.description || ''}</div>
          <div class="variants">${p.variants.map((it, i) => `<button class="var-btn ${i === vi ? 'active' : ''}" onclick="selectVariant('${p.id}',${i})">${it.size}</button>`).join('')}</div>
          <div class="card-footer"><div class="price">${v.price} ₽</div><button class="add-btn" ${ok ? '' : 'disabled'} onclick="addToCart('${p.id}')">В корзину</button></div>
        </div></div>`;
      }).join('');
  }

  function selectVariant(id, i) { selectedVariants[id] = i; renderProducts(); }
  function addToCart(id) {
    const p = products.find(x => x.id === id), v = p.variants[selectedVariants[id] || 0];
    const ex = cart.find(c => c.id === id && c.size === v.size);
    if (ex) ex.qty++; else cart.push({ id: p.id, name: p.name, size: v.size, price: v.price, weight_kg: v.weight_kg, qty: 1 });
    updateCartBar();
  }
  function updateCartBar() {
    const bar = document.getElementById('cartBar');
    if (!cart.length) { bar.classList.add('hidden'); return; }
    document.getElementById('cartCount').textContent = `В корзине: ${cart.reduce((s, i) => s + i.qty, 0)} шт.`;
    document.getElementById('cartTotal').textContent = `${cart.reduce((s, i) => s + i.price * i.qty, 0)} ₽ →`;
    bar.classList.remove('hidden');
  }

  function openAuth() { document.getElementById('authModal').classList.add('open'); }
  function openCart() { renderCartItems(); document.getElementById('cartModal').classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function renderCartItems() {
    const list = document.getElementById('cartItemsList');
    if (!cart.length) { list.innerHTML = '<p style="color:#6b7280;">Корзина пуста</p>'; return; }
    list.innerHTML = cart.map((it, i) => `<div class="cart-item"><div><b>${it.name}</b> (${it.size})<br><small>${it.price} ₽ × ${it.qty}</small></div>
      <div style="display:flex;gap:8px;align-items:center;"><button class="qty-btn" onclick="changeQty(${i},-1)">-</button><span>${it.qty}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button></div></div>`).join('');
  }
  function changeQty(i, d) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); renderCartItems(); updateCartBar(); }

  async function loginViaPhone() {
    const phone = document.getElementById('phoneLoginInput').value.trim();
    if (!phone) return alert('Введите телефон');
    await syncProfile({ phone, full_name: document.getElementById('nameLoginInput').value.trim() });
    closeModal('authModal');
  }
  function loginViaMessenger(t) { alert(`Откройте витрину через бота в ${t} для входа в 1 клик.`); }
  function loginViaOAuth(p) { window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=${p}&redirect_to=${encodeURIComponent(window.location.href)}`; }

  async function submitOrder(e) {
    e.preventDefault();
    if (!cart.length) return alert('Корзина пуста');
    const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Оформляем...';
    const gId = document.getElementById('groupSelect').value, name = document.getElementById('clientName').value.trim(), phone = document.getElementById('clientPhone').value.trim();
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    try {
      if (!currentUser) await syncProfile({ phone, full_name: name, default_group_id: gId });
      const data = await sbFetch('rpc/create_order_and_deduct_stock', {
        method: 'POST',
        body: JSON.stringify({ p_user_id: currentUser?.id || null, p_group_id: gId, p_name: name, p_phone: phone, p_items: cart, p_total: total, p_payment: document.getElementById('paymentSelect').value, p_comment: document.getElementById('clientComment').value.trim() })
      });
      alert(`✅ Заказ ${data.order_number} оформлен на ${total} ₽!`);
      cart = []; updateCartBar(); closeModal('cartModal'); init();
    } catch (err) { alert('Ошибка: ' + err.message); } finally { btn.disabled = false; btn.textContent = 'Оформить заказ'; }
  }
  init();
</script>
</body>
</html>
