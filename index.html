<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <title>Орехи и Сухофрукты</title>
  <style>
     :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #222630;
    --border: #2b303d;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #10b981;
    --accent-dark: #059669;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); padding-bottom: 78px; }

  /* Шапка в стиле Ozon */
  .oz-header { position: sticky; top: 0; z-index: 40; background: rgba(15, 17, 21, 0.94); backdrop-filter: blur(12px); padding: 10px 12px 8px; border-bottom: 1px solid var(--border); }
  .oz-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .oz-pvz { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--surface); border: 1px solid var(--border); padding: 6px 10px; border-radius: 12px; cursor: pointer; max-width: 72%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oz-pvz span { color: var(--accent); }
  .oz-auth-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap; }

  .oz-search { position: relative; }
  .oz-search input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px 10px 36px; border-radius: 14px; font-size: 14px; outline: none; transition: border-color .2s; }
  .oz-search input:focus { border-color: var(--accent); }
  .oz-search input::placeholder { color: var(--muted); }
  .oz-search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: 0.7; }

  .container { max-width: 1120px; margin: 0 auto; padding: 10px 12px; }

  /* Премиум-баннер сбора недели */
  .oz-banner { background: linear-gradient(135deg, #064e3b 0%, #111827 55%, #1f2937 100%); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .oz-banner-tag { display: inline-block; background: rgba(245, 158, 11, 0.18); color: #fbbf24; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .oz-banner-title { font-size: 16px; font-weight: 800; line-height: 1.25; margin-bottom: 4px; color: #fff; }
  .oz-banner-sub { font-size: 12px; color: #d1d5db; line-height: 1.35; }
  .oz-banner-ico { font-size: 42px; flex-shrink: 0; }

  /* Плитки категорий в стиле Ozon */
  .oz-cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin-bottom: 6px; scrollbar-width: none; }
  .oz-cats::-webkit-scrollbar { display: none; }
  .oz-cat-tile { flex: 0 0 auto; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; text-align: center; }
  .oz-cat-box { width: 56px; height: 56px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 26px; transition: all .18s; }
  .oz-cat-tile.active .oz-cat-box { background: linear-gradient(145deg, var(--accent), var(--accent-dark)); border-color: #34d399; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(16, 185, 129, 0.3); }
  .oz-cat-name { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .oz-cat-tile.active .oz-cat-name { color: #fff; font-weight: 700; }

  /* Сетка карточек по 2 в ряд на телефоне как в Ozon */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
  .card-img-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--surface-2); overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1f2937, #111827); font-size: 46px; }
  .card-art { position: absolute; top: 6px; left: 6px; background: rgba(15, 17, 21, 0.72); color: var(--muted); font-size: 10px; padding: 2px 6px; border-radius: 6px; backdrop-filter: blur(4px); }

  .card-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
  .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .price { font-size: 18px; font-weight: 800; color: #34d399; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.25; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-desc { font-size: 11px; color: var(--muted); line-height: 1.25; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }

  .variants { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .var-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 7px; border-radius: 8px; cursor: pointer; }
  .var-btn.active { background: rgba(16, 185, 129, 0.18); border-color: var(--accent); color: #34d399; }

  .add-btn { width: 100%; background: var(--accent); color: #052e16; border: none; border-radius: 11px; padding: 9px; font-size: 13px; font-weight: 800; cursor: pointer; transition: background .15s; }
  .add-btn:active { background: var(--accent-dark); }
  .qty-box { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border: 1px solid var(--accent); border-radius: 11px; overflow: hidden; }
  .qty-box button { background: transparent; border: none; color: #34d399; font-size: 18px; font-weight: 800; width: 36px; height: 34px; cursor: pointer; }
  .qty-box span { font-size: 13px; font-weight: 800; color: #fff; }

  /* Нижний Tab Bar как в Ozon */
  .oz-tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; background: rgba(15, 17, 21, 0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 4px 10px; }
  .oz-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; position: relative; }
  .oz-tab.active { color: var(--accent); }
  .oz-tab-ico { font-size: 20px; line-height: 1.1; }
  .oz-badge { position: absolute; top: -2px; right: 24%; background: var(--gold); color: #111827; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 99px; }

  /* Модальные окна (тёмная премиум-тема) */
  .modal { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  .modal.open { display: flex; }
  @media (min-width: 640px) { .modal { align-items: center; } }
  .modal-card { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px 24px; }
  @media (min-width: 640px) { .modal-card { border-radius: 20px; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { font-size: 18px; font-weight: 800; }
  .close-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .form-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 10px; }
  .grp-option { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .grp-option.selected { border-color: var(--accent); background: rgba(16, 185, 129, 0.12); }
  .hidden { display: none !important; }
      .modal-content { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px 24px; }
  @media (min-width: 600px) { .modal-content { border-radius: 20px; } }
  .auth-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 700; margin-bottom: 10px; cursor: pointer; }
  .auth-btn.max { background: #5465da; color: #fff; border: none; }
  .auth-btn.tg { background: #24A1DE; color: #fff; border: none; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 12px; font-size: 14px; }
  .primary-btn { width: 100%; padding: 13px; background: var(--accent); color: #052e16; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-header h2 { font-size: 18px; font-weight: 800; color: #fff; }
  .pill-btn { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; }

  </style>
</head>
<body>
<header class="oz-header">
  <div class="oz-top">
    <div class="oz-pvz" onclick="openCart()">
      📍 <span id="groupBadge">Выбрать группу</span> ⌄
    </div>
    <button class="oz-auth-btn" id="authBadge" onclick="openAuth()">👤 Войти</button>
  </div>
  <div class="oz-search">
    <span class="oz-search-ico">🔍</span>
    <input type="text" id="searchInput" placeholder="Искать орехи, манго, специи, чай..." oninput="renderProducts()">
  </div>
</header>

<main class="container">
  <div class="oz-banner" onclick="openCart()" style="cursor:pointer;">
    <div>
      <div class="oz-banner-tag">Свежая фасовка под заказ</div>
      <div class="oz-banner-title">Орехи, сухофрукты и специи</div>
      <div class="oz-banner-sub" id="deliveryBanner">Выберите вашу группу, чтобы узнать дату выдачи</div>
    </div>
    <div class="oz-banner-ico">🥜</div>
  </div>

  <div class="oz-cats" id="catsBar"></div>
  <div id="statusMsg" class="status-msg" style="text-align:center; padding:24px; color:var(--muted);">Подключаемся к базе данных...</div>
  <div class="grid" id="productsGrid"></div>
</main>

<nav class="oz-tabbar">
  <button class="oz-tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="oz-tab-ico">🏠</span><span>Главная</span>
  </button>
  <button class="oz-tab" onclick="document.getElementById('searchInput').focus()">
    <span class="oz-tab-ico">🔍</span><span>Поиск</span>
  </button>
  <button class="oz-tab" onclick="openCart()">
    <span class="oz-tab-ico">🛒</span>
    <span class="oz-badge hidden" id="tabCartBadge">0</span>
    <span id="tabCartLabel">Корзина</span>
  </button>
  <button class="oz-tab" onclick="openAuth()">
    <span class="oz-tab-ico">👤</span><span>Кабинет</span>
  </button>
</nav>


<div class="modal" id="authModal">
  <div class="modal-content">
        <div class="modal-header">
      <h2 id="profileModalTitle">Вход в профиль</h2>
      <button class="close-btn" onclick="closeModal('authModal')">×</button>
    </div>

        <div id="clientCabinet" style="display:none;">
      <div style="background:var(--surface-2); border:1px solid var(--border); padding:12px 14px; border-radius:14px; margin-bottom:14px; font-size:13px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <b id="cabName" style="font-size:15px; color:#fff;"></b><br>
            <span id="cabPhone" style="color:var(--muted);"></span>
          </div>
          <button class="pill-btn" style="background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.4); color:#f87171;" onclick="clientLogout()">Выйти</button>
        </div>
      </div>
      <h4 style="font-size:15px; margin-bottom:10px; color:#fff;">📦 Мои заказы</h4>
      <div id="myOrdersList" style="font-size:13px; color:var(--muted);">Загружаем историю заказов...</div>
    </div>
    <div id="clientLoginForm">
      <button class="auth-btn max" onclick="loginViaMessenger('MAX')">💬 Войти через MAX</button>
      <button class="auth-btn tg" onclick="loginViaMessenger('Telegram')">✈️ Войти через Telegram</button>
      <button class="auth-btn vk" onclick="loginViaOAuth('vk')">🔵 Войти с VK ID</button>
      <button class="auth-btn yandex" onclick="loginViaOAuth('yandex')">🔴 Войти с Яндекс ID</button>
      <div class="form-group"><input type="tel" class="form-control" id="phoneLoginInput" placeholder="+7 (999) 000-00-00"></div>
      <div class="form-group"><input type="text" class="form-control" id="nameLoginInput" placeholder="Ваше имя"></div>
      <button class="primary-btn" onclick="loginViaPhone()">Продолжить</button>
    </div>

  </div>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-header"><h2>Ваш заказ</h2><button class="close-btn" onclick="closeModal('cartModal')">×</button></div>
    <div id="cartItemsList"></div>
    <form id="orderForm" onsubmit="submitOrder(event)" style="margin-top:14px;">
      <div class="form-group"><label>Ваша группа выдачи*</label><select class="form-control" id="groupSelect" required onchange="onGroupChange()"></select></div>
      <div class="form-group"><label>Ваше Имя*</label><input type="text" class="form-control" id="clientName" required></div>
      <div class="form-group"><label>Телефон*</label><input type="tel" class="form-control" id="clientPhone" required placeholder="+7 900 000-00-00"></div>
      <div class="form-group"><label>Оплата</label><select class="form-control" id="paymentSelect"><option value="Наличными">Наличными</option><option value="Перевод">Перевод СБП</option></select></div>
      <div class="form-group"><label>Комментарий</label><input type="text" class="form-control" id="clientComment"></div>
      <button type="submit" class="primary-btn" id="submitBtn">Оформить заказ</button>
    </form>
  </div>
</div>
<script>
  
   const PROXY_URL = 'https://functions.yandexcloud.net/d4e8bc8b2ghfd5kgtm3j';
  const SUPABASE_ANON_KEY = 'sb_publishable_0e8FU4Ejk9d_IoLp8bh-zw_oOOQNaI8';

  async function sbFetch(path, options = {}) {
    const res = await fetch(PROXY_URL, {
      ...options,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'X-Proxy-Path': `rest/v1/${path}`,
        ...(options.headers || {})
      }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }

  let products = [], groups = [], activeCategory = 'Все', selectedVariants = {}, cart = [];
  let currentUser = JSON.parse(localStorage.getItem('nut_user') || 'null');

    async function syncProfile(userData) {
    const col = userData.telegram_id ? 'telegram_id' : userData.max_id ? 'max_id' : userData.vk_id ? 'vk_id' : 'phone';
    if (!userData[col]) return;
    try {
      const ex = await sbFetch(`profiles?${col}=eq.${encodeURIComponent(userData[col])}&select=*`);
      let p = Array.isArray(ex) ? ex[0] : ex;
      if (!p) {
        const cr = await sbFetch('profiles', {
          method: 'POST',
          headers: { 'Prefer': 'return=representation' },
          body: JSON.stringify(userData)
        });
        p = Array.isArray(cr) ? cr[0] : cr;
      }
      if (p) {
        currentUser = p;
        localStorage.setItem('nut_user', JSON.stringify(p));
        updateUserUI();
      }
    } catch (e) { console.warn(e); }
  }


  function updateUserUI() {
    if (!currentUser) return;
    document.getElementById('authBadge').textContent = '👤 ' + (currentUser.full_name || currentUser.phone || 'Профиль');
    if (currentUser.full_name) document.getElementById('clientName').value = currentUser.full_name;
    if (currentUser.phone) document.getElementById('clientPhone').value = currentUser.phone;
  }

  async function init() {
    const statusEl = document.getElementById('statusMsg');
    try {
      if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        const u = window.Telegram.WebApp.initDataUnsafe.user;
        await syncProfile({ telegram_id: String(u.id), full_name: `${u.first_name || ''} ${u.last_name || ''}`.trim() });
      } else if (window.WebApp?.initDataUnsafe?.user) {
        const u = window.WebApp.initDataUnsafe.user;
        await syncProfile({ max_id: String(u.id), full_name: `${u.first_name || ''} ${u.last_name || ''}`.trim() });
      }
      updateUserUI();
await sbFetch('rpc/refresh_group_dates', { method: 'POST', body: '{}' }).catch(() => {});

      const [prods, grps] = await Promise.all([
           sbFetch('products?is_active=eq.true&order=id.asc'),
        sbFetch('pickup_groups?is_active=eq.true')
      ]);
      products = prods || []; groups = grps || [];
      products.forEach(p => { selectedVariants[p.id] = 0; });

      statusEl.style.display = products.length ? 'none' : 'block';
      if (!products.length) statusEl.textContent = 'База подключена, но товаров пока нет.';

      renderCategories(); populateGroups(); renderProducts();
    } catch (err) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = `Ошибка базы:<br><small style="color:#dc2626">${err.message}</small>`;
    }
  }

   const CAT_ICONS = {
     'Все': '✨', '❤️ Избранное': '❤️', 'Орехи': '🥜', 'Сухофрукты': '🥭', 'Масло и соус': '🫒',
    'Сладкое': '🍫', 'Специи': '🌶️', 'Чай': '🍵', 'Консервация и соусы': '🫙',
    'Турецкие сладости': '🍯', 'Наборы': '🎁', 'Сублимированные фрукты и ягоды': '🍓'
  };

  function renderCategories() {
      const cats = ['Все', '❤️ Избранное', ...new Set(products.map(p => p.category))];
    document.getElementById('catsBar').innerHTML = cats.map(c => `
      <div class="oz-cat-tile ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">
        <div class="oz-cat-box">${CAT_ICONS[c] || '🌿'}</div>
        <div class="oz-cat-name">${c}</div>
      </div>`).join('');
  }

  function setCategory(c) { activeCategory = c; renderCategories(); renderProducts(); }

  function populateGroups() {
    const sel = document.getElementById('groupSelect');
    sel.innerHTML = '<option value="">-- Выберите группу --</option>' + groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    const ug = new URLSearchParams(window.location.search).get('group') || currentUser?.default_group_id;
    if (ug && groups.some(g => g.id === ug)) sel.value = ug;
    onGroupChange();
  }

  function onGroupChange() {
    const g = groups.find(x => x.id === document.getElementById('groupSelect').value);
    document.getElementById('groupBadge').textContent = g ? g.name : 'Выбрать группу';
    document.getElementById('deliveryBanner').innerHTML = g
      ? `📍 <b>${g.name}</b> (${g.address || ''})<br>Сбор до: <b>${g.collect_until}</b> • Выдача: <b>${g.delivery_date}</b>`
      : '👆 Выберите вашу группу, чтобы увидеть дату выдачи';
  }
  function renderProducts() {
       const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const favs = getFavs();
    document.getElementById('productsGrid').innerHTML = products
      .filter(p => {
        const matchCat = activeCategory === 'Все' ? true : (activeCategory === '❤️ Избранное' ? favs.includes(p.id) : p.category === activeCategory);
        return matchCat && (p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
      })
      .sort((a, b) => String(a.id).padStart(6, '0').localeCompare(String(b.id).padStart(6, '0')))
      .map(p => {
        const vi = selectedVariants[p.id] || 0, v = p.variants[vi];
        const inCart = cart.find(c => c.id === p.id && c.size === v.size);
        const isFav = favs.includes(p.id);
        const ico = CAT_ICONS[p.category] || '🥜';
        const imgHtml = p.image_url
          ? `<img class="card-img" src="${p.image_url}" loading="lazy">`
          : `<div class="card-ph">${ico}</div>`;
        const actionBtn = inCart
          ? `<div class="qty-box"><button onclick="changeQtyByProd('${p.id}', -1)">−</button><span>${inCart.qty} шт.</span><button onclick="changeQtyByProd('${p.id}', 1)">+</button></div>`
          : `<button class="add-btn" onclick="addToCart('${p.id}')">В корзину</button>`;
        return `<div class="card">
          <div class="card-img-wrap">
            <span class="card-art">арт. ${p.id}</span>
            <button onclick="event.stopPropagation(); toggleFav('${p.id}')" style="position:absolute; top:6px; right:6px; z-index:2; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:rgba(15,17,21,0.78); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;">${isFav ? '❤️' : '🤍'}</button>
            ${imgHtml}
          </div>
          <div class="card-body">
            <div class="price-row"><div class="price">${v.price} ₽</div></div>
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.description || ''}</div>
            <div class="variants">${p.variants.map((it, i) => `<button class="var-btn ${i === vi ? 'active' : ''}" onclick="selectVariant('${p.id}',${i})">${it.size}</button>`).join('')}</div>
            ${actionBtn}
          </div>
        </div>`;
      }).join('');

  }

  function selectVariant(id, i) { selectedVariants[id] = i; renderProducts(); }

  function addToCart(id) {
    const p = products.find(x => x.id === id), v = p.variants[selectedVariants[id] || 0];
    const ex = cart.find(c => c.id === id && c.size === v.size);
    if (ex) ex.qty++; else cart.push({ id: p.id, name: p.name, size: v.size, price: v.price, weight_kg: v.weight_kg, qty: 1 });
    updateCartBar();
    renderProducts();
  }

  function changeQtyByProd(id, delta) {
    const p = products.find(x => x.id === id), v = p.variants[selectedVariants[id] || 0];
    const idx = cart.findIndex(c => c.id === id && c.size === v.size);
    if (idx === -1) return;
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    updateCartBar();
    renderProducts();
  }

  function updateCartBar() {
    const cnt = cart.reduce((s, i) => s + i.qty, 0);
    const sum = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const badge = document.getElementById('tabCartBadge');
    const lbl = document.getElementById('tabCartLabel');
    if (badge) {
      badge.textContent = cnt;
      badge.classList.toggle('hidden', cnt === 0);
    }
    if (lbl) lbl.textContent = cnt > 0 ? `${sum} ₽` : 'Корзина';
  }
    async function openAuth() {
    document.getElementById('authModal').classList.add('open');
    const cab = document.getElementById('clientCabinet');
    const form = document.getElementById('clientLoginForm');
    const title = document.getElementById('profileModalTitle');

    if (currentUser) {
      title.textContent = 'Личный кабинет';
      form.style.display = 'none';
      cab.style.display = 'block';
      document.getElementById('cabName').textContent = currentUser.full_name || 'Покупатель';
      document.getElementById('cabPhone').textContent = currentUser.phone || '';
      await loadMyOrders();
    } else {
      title.textContent = 'Вход в профиль';
      cab.style.display = 'none';
      form.style.display = 'block';
    }
  }

  function clientLogout() {
    currentUser = null;
    localStorage.removeItem('nut_user');
    document.getElementById('authBadge').textContent = 'Войти';
    openAuth();
  }

  let cachedMyOrders = [];

  async function loadMyOrders() {
    const list = document.getElementById('myOrdersList');
    list.innerHTML = 'Загружаем заказы...';
    try {
      const filter = currentUser.id
        ? `or=(user_id.eq.${currentUser.id}${currentUser.phone ? `,customer_phone.eq.${encodeURIComponent(currentUser.phone)}` : ''})`
        : `customer_phone=eq.${encodeURIComponent(currentUser.phone)}`;

      const orders = await sbFetch(`orders?${filter}&order=created_at.desc&limit=20`);
      cachedMyOrders = orders || [];

           setCabTab(currentCabTab);
    } catch (err) {
      list.innerHTML = `<p style="color:#dc2626;">Ошибка загрузки: ${err.message}</p>`;
    }
  }

  let currentCabTab = 'active';

  function getFavs() {
    try { return JSON.parse(localStorage.getItem('nut_favs') || '[]'); } catch { return []; }
  }

  function toggleFav(id) {
    const favs = getFavs();
    const idx = favs.indexOf(id);
    if (idx === -1) favs.push(id); else favs.splice(idx, 1);
    localStorage.setItem('nut_favs', JSON.stringify(favs));
    renderProducts();
    if (document.getElementById('authModal').classList.contains('open')) renderCabinetContent();
  }

  function setCabTab(tab) {
    currentCabTab = tab;
    ['active', 'done', 'fav'].forEach(t => {
      const btn = document.getElementById('cabTab' + t.charAt(0).toUpperCase() + t.slice(1));
      if (!btn) return;
      const isAct = t === tab;
      btn.style.background = isAct ? 'rgba(16,185,129,0.2)' : 'var(--surface-2)';
      btn.style.borderColor = isAct ? 'var(--accent)' : 'var(--border)';
      btn.style.color = isAct ? '#34d399' : 'var(--text)';
    });
    renderCabinetContent();
  }

  function renderCabinetContent() {
    const list = document.getElementById('myOrdersList');
    if (!list) return;

    if (currentCabTab === 'fav') {
      const favIds = getFavs();
      const favProds = products.filter(p => favIds.includes(p.id));
      if (!favProds.length) {
        list.innerHTML = '<div style="padding:24px 0; text-align:center;">Вы пока не добавили товары в избранное.<br><small>Нажмите 🤍 на карточке любого товара на витрине.</small></div>';
        return;
      }
      list.innerHTML = favProds.map(p => {
        const v = (p.variants && p.variants) || { size: '', price: 0 };
        return `
          <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div>
              <b style="color:#fff; font-size:13px;">${p.name}</b><br>
              <span style="color:#34d399; font-weight:700;">${v.price} ₽</span> <small style="color:var(--muted);">(${v.size})</small>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="pill-btn" style="background:var(--accent); color:#052e16; border:none;" onclick="addToCart('${p.id}'); closeModal('authModal'); openCart();">В корзину</button>
              <button class="pill-btn" onclick="toggleFav('${p.id}')">💔</button>
            </div>
          </div>`;
      }).join('');
      return;
    }

    const filtered = (cachedMyOrders || []).filter(o => currentCabTab === 'active' ? o.status === 'new' : o.status !== 'new');
    if (!filtered.length) {
      list.innerHTML = `<div style="padding:24px 0; text-align:center;">${currentCabTab === 'active' ? 'Активных заказов в сборе сейчас нет' : 'Полученных заказов пока нет'}</div>`;
      return;
    }

    list.innerHTML = filtered.map(o => {
      const idx = cachedMyOrders.indexOf(o);
      const grp = groups.find(g => g.id === o.group_id);
      const dt = new Date(o.created_at).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const statusBadge = o.status === 'new'
        ? '<span style="background:rgba(245,158,11,0.18); color:#fbbf24; padding:2px 8px; border-radius:10px; font-weight:700; font-size:11px;">Принят в сбор</span>'
        : '<span style="background:rgba(16,185,129,0.18); color:#34d399; padding:2px 8px; border-radius:10px; font-weight:700; font-size:11px;">Выдан ✓</span>';
      return `
        <div style="background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; color:var(--text);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <b style="color:#fff;">Заказ ${o.order_number || '#' + o.id} от ${dt}</b>
            ${statusBadge}
          </div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
            📍 Группа: <b style="color:#e5e7eb;">${grp ? grp.name : o.group_id}</b>${grp?.delivery_date ? ` • Выдача: <b style="color:#34d399;">${grp.delivery_date}</b>` : ''}
          </div>
          <div style="background:var(--bg); border:1px solid var(--border); padding:8px 10px; border-radius:10px; font-size:12px; color:#d1d5db; line-height:1.45; margin-bottom:8px;">
            ${(o.items || []).map(i => `• ${i.name} (${i.size}) × ${i.qty} шт. — <b>${i.price * i.qty} ₽</b>`).join('<br>')}
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <b style="color:#34d399; font-size:14px;">Итого: ${o.total_amount} ₽</b>
            <button class="pill-btn" style="background:rgba(16,185,129,0.15); border-color:var(--accent); color:#34d399;" onclick="repeatOrder(${idx})">🔄 Повторить заказ</button>
          </div>
        </div>`;
    }).join('');
  }

  function repeatOrder(idx) {
    const o = cachedMyOrders[idx];
    if (!o || !o.items) return;
    cart = o.items.map(i => ({ ...i }));
    if (o.group_id && groups.some(g => g.id === o.group_id)) {
      document.getElementById('groupSelect').value = o.group_id;
      onGroupChange();
    }
    updateCartBar();
    closeModal('authModal');
    openCart();
  }

  function openCart() {
  updateUserUI();
  renderCartItems();
  document.getElementById('cartModal').classList.add('open');
}

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function renderCartItems() {
    const list = document.getElementById('cartItemsList');
    if (!cart.length) { list.innerHTML = '<p style="color:#6b7280;">Корзина пуста</p>'; return; }
    list.innerHTML = cart.map((it, i) => `<div class="cart-item"><div><b>${it.name}</b> (${it.size})<br><small>${it.price} ₽ × ${it.qty}</small></div>
      <div style="display:flex;gap:8px;align-items:center;"><button class="qty-btn" onclick="changeQty(${i},-1)">-</button><span>${it.qty}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button></div></div>`).join('');
  }
  function changeQty(i, d) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); renderCartItems(); updateCartBar(); }

  async function loginViaPhone() {
    const phone = document.getElementById('phoneLoginInput').value.trim();
    if (!phone) return alert('Введите телефон');
    await syncProfile({ phone, full_name: document.getElementById('nameLoginInput').value.trim() });
    closeModal('authModal');
  }
  function loginViaMessenger(t) { alert(`Откройте витрину через бота в ${t} для входа в 1 клик.`); }
  function loginViaOAuth(p) { window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=${p}&redirect_to=${encodeURIComponent(window.location.href)}`; }

  async function submitOrder(e) {
    e.preventDefault();
    if (!cart.length) return alert('Корзина пуста');
    const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Оформляем...';
    const gId = document.getElementById('groupSelect').value, name = document.getElementById('clientName').value.trim(), phone = document.getElementById('clientPhone').value.trim();
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    try {
      if (!currentUser) await syncProfile({ phone, full_name: name, default_group_id: gId });
      const data = await sbFetch('rpc/create_order_and_deduct_stock', {
        method: 'POST',
        body: JSON.stringify({ p_user_id: currentUser?.id || null, p_group_id: gId, p_name: name, p_phone: phone, p_items: cart, p_total: total, p_payment: document.getElementById('paymentSelect').value, p_comment: document.getElementById('clientComment').value.trim() })
      });
      alert(`✅ Заказ ${data.order_number} оформлен на ${total} ₽!`);
      cart = []; updateCartBar(); closeModal('cartModal'); init();
    } catch (err) { alert('Ошибка: ' + err.message); } finally { btn.disabled = false; btn.textContent = 'Оформить заказ'; }
  }
  init();
</script>
</body>
</html>
