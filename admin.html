<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Админка — Орехи и Сухофрукты</title>
  <style>
    :root { --bg: #f3f4f6; --card: #fff; --text: #111827; --muted: #6b7280; --accent: #2e7d32; --border: #e5e7eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    .topbar { background: #1f2937; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
    .topbar h1 { font-size: 16px; }
    .logout-btn { background: #374151; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 48px; z-index: 15; }
    .tab { flex: 1; padding: 12px; text-align: center; font-weight: 700; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .container { max-width: 800px; margin: 0 auto; padding: 14px; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .login-box { max-width: 380px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn.sm { width: auto; padding: 7px 12px; font-size: 12px; }
    .btn.gray { background: #6b7280; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; background: #e8f5e9; color: var(--accent); }
    .badge.new { background: #fef3c7; color: #b45309; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="loginScreen" class="login-box">
  <h2 style="margin-bottom:16px; text-align:center;">🔐 Вход в управление</h2>
  <form onsubmit="adminLogin(event)">
    <div class="form-group"><label>Email администратора</label><input type="email" id="loginEmail" class="form-control" required></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="loginPass" class="form-control" required></div>
    <button type="submit" class="btn" id="loginBtn">Войти в панель</button>
  </form>
</div>
<div id="adminApp" class="hidden">
  <div class="topbar">
    <h1>⚙️ Управление магазином</h1>
    <div class="row">
      <a href="index.html" target="_blank" style="color:#a7f3d0; font-size:12px; text-decoration:none;">Витрина ↗</a>
      <button class="logout-btn" onclick="adminLogout()">Выйти</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('orders', this)">📦 Заказы</div>
        <div class="tab" onclick="switchTab('supply', this)">🚚 Закупка</div>
    <div class="tab" onclick="switchTab('products', this)">🥜 Товары и склад</div>
    <div class="tab" onclick="switchTab('groups', this)">📍 Группы и даты</div>
  </div>
  <div class="container">
    <div id="tab-orders"><div id="ordersList">Загружаем заказы...</div></div>
    <div id="tab-products" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:10px; font-size:15px;">➕ Добавить / Обновить товар</h3>
        <form onsubmit="saveProduct(event)">
          <div class="row">
            <div class="form-group" style="flex:1;"><label>Артикул (id)*</label><input type="text" id="pId" class="form-control" placeholder="01025" required></div>
            <div class="form-group" style="flex:2;"><label>Категория*</label><input type="text" id="pCat" class="form-control" value="Орехи" required></div>
          </div>
          <div class="form-group"><label>Название товара*</label><input type="text" id="pName" class="form-control" required></div>
          <div class="form-group"><label>Описание</label><input type="text" id="pDesc" class="form-control"></div>
          <div class="row">
            <div class="form-group" style="flex:1;"><label>Остаток (кг)*</label><input type="number" step="0.01" id="pStock" class="form-control" value="10" required></div>
            <div class="form-group" style="flex:1;"><label>Цена 0.5 кг*</label><input type="number" id="pPriceHalf" class="form-control" required></div>
            <div class="form-group" style="flex:1;"><label>Цена 1 кг*</label><input type="number" id="pPriceFull" class="form-control" required></div>
          </div>
          <div class="form-group"><label>Фото товара</label><input type="file" id="pPhoto" accept="image/*" class="form-control"></div>
          <button type="submit" class="btn" id="saveProdBtn">Сохранить товар</button>
        </form>
      </div>
      <div id="productsList"></div>
    </div>
    <div id="tab-groups" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:10px; font-size:15px;">➕ Добавить / Изменить группу</h3>
        <form onsubmit="saveGroup(event)">
          <div class="row">
            <div class="form-group" style="flex:1;"><label>Код (лат.)*</label><input type="text" id="gId" class="form-control" placeholder="solnechnii" required></div>
            <div class="form-group" style="flex:2;"><label>Название группы*</label><input type="text" id="gName" class="form-control" required></div>
          </div>
          <div class="row">
            <div class="form-group" style="flex:1;"><label>Сбор до</label><input type="text" id="gCollect" class="form-control" placeholder="26.11.2026 до 20:00"></div>
            <div class="form-group" style="flex:1;"><label>Дата выдачи</label><input type="text" id="gDelivery" class="form-control" placeholder="29.11.2026 с 18:00"></div>
          </div>
          <div class="form-group"><label>Адрес выдачи</label><input type="text" id="gAddress" class="form-control"></div>
          <div class="row">
            <div class="form-group" style="flex:1;"><label>ID чата MAX</label><input type="text" id="gMax" class="form-control"></div>
            <div class="form-group" style="flex:1;"><label>ID чата Telegram</label><input type="text" id="gTg" class="form-control"></div>
          </div>
          <button type="submit" class="btn">Сохранить группу</button>
        </form>
      </div>
      <div id="groupsList"></div>
    </div>
        <!-- ВКЛАДКА 4: ЗАКУПКА У ПОСТАВЩИКА -->
    <div id="tab-supply" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:10px; font-size:15px;">📊 Сводка заказа поставщику</h3>
        <div class="row" style="margin-bottom:10px;">
          <div class="form-group" style="flex:1;"><label>Заказы С (дата)</label><input type="date" id="supFrom" class="form-control"></div>
          <div class="form-group" style="flex:1;"><label>ПО (дата)</label><input type="date" id="supTo" class="form-control"></div>
        </div>
        <div class="form-group">
          <label>Группы (оставьте все или снимите лишние):</label>
          <div id="supGroupsChecks" class="row" style="gap:12px; font-size:13px;"></div>
        </div>
        <div class="row">
          <button class="btn" style="flex:2;" onclick="calcSupply()">Рассчитать закупку</button>
          <button class="btn gray" style="flex:1;" onclick="copySupply()">📋 Копировать</button>
        </div>
      </div>
      <div id="supplyResult"></div>
    </div>
  </div>
</div>
<script>
  const PROXY = 'https://functions.yandexcloud.net/d4e8bc8b2ghfd5kgtm3j';
  const SB_URL = 'https://bhfzkdduwabffqgpcgdt.supabase.co';
  const PUB = 'sb_publishable_0e8FU4Ejk9d_IoLp8bh-zw_oOOQNaI8';
  let jwt = localStorage.getItem('adm_t') || '';
  let allProducts = [];

  async function req(p, opt = {}) {
    const r = await fetch(PROXY, {
      ...opt,
      headers: {
        'apikey': PUB,
        'X-Admin-Token': 'Bearer ' + jwt,
        'Content-Type': 'application/json',
        'X-Proxy-Path': p,
        ...(opt.headers || {})
      }
    });
    if (r.status === 401) { adminLogout(); throw new Error('Войдите заново'); }
    if (!r.ok) throw new Error(await r.text());
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  async function adminLogin(e) {
    e.preventDefault();
    const b = document.getElementById('loginBtn'); b.textContent = '...';
    try {
      const r = await fetch(PROXY, {
        method: 'POST',
        headers: { 'apikey': PUB, 'Content-Type': 'application/json', 'X-Proxy-Path': 'auth/v1/token?grant_type=password' },
        body: JSON.stringify({ email: document.getElementById('loginEmail').value.trim(), password: document.getElementById('loginPass').value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error_description || d.msg || 'Ошибка входа');
      jwt = d.access_token;
      localStorage.setItem('adm_t', jwt);
      showApp();
    } catch (err) { alert(err.message); } finally { b.textContent = 'Войти в панель'; }
  }

  function adminLogout() {
    jwt = ''; localStorage.removeItem('adm_t');
    document.getElementById('adminApp').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }

  function switchTab(n, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    ['orders', 'products', 'groups', 'supply'].forEach(i => document.getElementById('tab-' + i).classList.toggle('hidden', i !== n));
  }

  async function showApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    // Добавляем универсальное поле фасовок и поиск в форму товара
    const pForm = document.querySelector('#tab-products form');
    if (pForm && !document.getElementById('pVariantsText')) {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.innerHTML = '<label>Фасовки и цены (0.5 кг=350, 1 кг=700)</label><input type="text" id="pVariantsText" class="form-control" style="margin-bottom:8px;" placeholder="0.5 кг=350, 1 кг=700"><label>Вес 1 коробки у поставщика (кг)</label><input type="number" step="0.1" id="pBoxWeight" class="form-control" value="5">';
      pForm.insertBefore(div, document.getElementById('pPhoto').parentElement);
      document.getElementById('pPriceHalf').required = false;
      document.getElementById('pPriceFull').required = false;
      document.getElementById('pPriceHalf').parentElement.parentElement.style.display = 'none';
    }
    loadAll();
  }
  async function loadAll() {
    const [ords, prods, grps] = await Promise.all([
      req('rest/v1/orders?order=created_at.desc&limit=50'),
      req('rest/v1/products?order=sort_order.asc,id.asc'),
      req('rest/v1/pickup_groups?order=name.asc')
    ]);
    allProducts = prods || [];

    document.getElementById('ordersList').innerHTML = (ords || []).map(o => `
      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:6px;">
          <b>${o.order_number}</b>
          <span class="badge ${o.status === 'new' ? 'new' : ''}">${o.status === 'new' ? 'Новый' : 'Выдан'}</span>
        </div>
        <div style="font-size:13px;margin-bottom:6px;">📍 <b>${o.group_id}</b> | 👤 ${o.customer_name} (${o.customer_phone})</div>
        <div style="font-size:12px;background:#f9fafb;padding:8px;border-radius:8px;margin-bottom:8px;">
          ${(o.items || []).map(i => `• ${i.name} (${i.size}) × ${i.qty} = ${i.price * i.qty} ₽`).join('<br>')}
        </div>
        <div class="row" style="justify-content:space-between;">
          <b>Итого: ${o.total_amount} ₽ (${o.payment_method})</b>
          ${o.status === 'new' ? `<button class="btn sm" onclick="markDone(${o.id})">Выдан ✓</button>` : ''}
        </div>
      </div>`).join('') || '<p>Заказов пока нет</p>';

    document.getElementById('productsList').innerHTML = allProducts.map(p => `
      <div class="card" style="${p.is_active ? '' : 'opacity:0.6;'}">
        <div class="row" style="justify-content:space-between;">
          <div style="display:flex;gap:10px;align-items:center;">
            ${p.image_url ? `<img src="${p.image_url}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;">` : ''}
            <div><b>[${p.id}] ${p.name}</b> <small style="color:#6b7280;">(${p.category})</small><br>
            <small>${(p.variants || []).map(v => `${v.size}: <b>${v.price}₽</b>`).join(' / ')}</small></div>
          </div>
          <div class="row">
            <input type="number" step="0.1" id="stk-${p.id}" value="${p.stock_kg}" style="width:64px;padding:6px;border:1px solid #ccc;border-radius:8px;">
            <button class="btn sm" onclick="updStk('${p.id}')">Кг ✓</button>
            <button class="btn sm" style="background:#2563eb;" onclick="editProd('${p.id}')">✏️ Изм.</button>
            <button class="btn sm gray" onclick="togProd('${p.id}',${!p.is_active})">${p.is_active ? 'Скрыть' : 'Показать'}</button>
            <button class="btn sm" style="background:#dc2626;" onclick="delProd('${p.id}')">🗑️</button>
          </div>
        </div>
      </div>`).join('');

    document.getElementById('groupsList').innerHTML = (grps || []).map(g => `
      <div class="card"><b>${g.name}</b> (<code>?group=${g.id}</code>)<br>
      <small>Сбор: <b>${g.collect_until || '-'}</b> | Выдача: <b>${g.delivery_date || '-'}</b> | ${g.address || ''}</small></div>`).join('');
        initSupplyFilters(grps);
  }

  function editProd(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('pId').value = p.id;
    document.getElementById('pCat').value = p.category;
    document.getElementById('pName').value = p.name;
    document.getElementById('pDesc').value = p.description || '';
    document.getElementById('pStock').value = p.stock_kg;
    document.getElementById('pVariantsText').value = (p.variants || []).map(v => `${v.size}=${v.price}`).join(', ');
        document.getElementById('pBoxWeight').value = p.box_weight_kg || 5;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function updStk(id) {
    const v = parseFloat(document.getElementById('stk-' + id).value) || 0;
    await req(`rest/v1/products?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify({ stock_kg: v }) });
    alert('Остаток обновлен!');
  }
  async function togProd(id, st) {
    await req(`rest/v1/products?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify({ is_active: st }) });
    loadAll();
  }
  async function delProd(id) {
    if (!confirm(`Удалить товар [${id}] навсегда?`)) return;
    await req(`rest/v1/products?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
    loadAll();
  }
  async function markDone(id) {
    await req(`rest/v1/orders?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'completed' }) });
    loadAll();
  }

  function parseVariants(str) {
    return str.split(',').map(part => {
      const [sz, pr] = part.split('=').map(s => s.trim());
      const num = parseFloat((sz || '').replace(',', '.')) || 0.5;
      const w = (sz || '').includes('гр') || (sz || '').includes('мл') ? num / 1000 : num;
      return { size: sz || '0.5 кг', price: Number(pr) || 0, weight_kg: w };
    }).filter(x => x.size);
  }

  async function saveProduct(e) {
    e.preventDefault();
    const b = document.getElementById('saveProdBtn'); b.textContent = 'Сохраняем...';
    const id = document.getElementById('pId').value.trim();
    const file = document.getElementById('pPhoto').files[0];
    let img = null;
    try {
      if (file) {
        const fn = `${id}_${Date.now()}.${file.name.split('.').pop()}`;
        const up = await fetch(PROXY, {
          method: 'POST',
          headers: { 'apikey': PUB, 'X-Admin-Token': 'Bearer ' + jwt, 'Content-Type': file.type, 'X-Proxy-Path': `storage/v1/object/products/${fn}` },
          body: file
        });
        if (up.ok) img = `${SB_URL}/storage/v1/object/public/products/${fn}`;
      }
      const vText = document.getElementById('pVariantsText').value.trim();
      const pl = {
        id,
        category: document.getElementById('pCat').value.trim(),
        name: document.getElementById('pName').value.trim(),
        description: document.getElementById('pDesc').value.trim(),
        stock_kg: parseFloat(document.getElementById('pStock').value) || 0,
                box_weight_kg: parseFloat(document.getElementById('pBoxWeight').value) || 5,
        variants: vText ? parseVariants(vText) : [{ size: '0.5 кг', price: 0, weight_kg: 0.5 }],
        is_active: true
      };
      if (img) pl.image_url = img;
      await req('rest/v1/products', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify(pl) });
      alert('✅ Товар сохранен!'); e.target.reset(); loadAll();
    } catch (err) { alert(err.message); } finally { b.textContent = 'Сохранить товар'; }
  }

  async function saveGroup(e) {
    e.preventDefault();
    const pl = {
      id: document.getElementById('gId').value.trim(),
      name: document.getElementById('gName').value.trim(),
      collect_until: document.getElementById('gCollect').value.trim(),
      delivery_date: document.getElementById('gDelivery').value.trim(),
      address: document.getElementById('gAddress').value.trim(),
      max_chat_id: document.getElementById('gMax').value.trim() || null,
      telegram_chat_id: document.getElementById('gTg').value.trim() || null,
      is_active: true
    };
    try {
      await req('rest/v1/pickup_groups', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify(pl) });
      alert('✅ Группа сохранена!'); e.target.reset(); loadAll();
    } catch (err) { alert(err.message); }
      let lastSupplyText = '';

  function initSupplyFilters(grps) {
    const today = new Date().toISOString().slice(0, 10);
    const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    if (!document.getElementById('supFrom').value) document.getElementById('supFrom').value = weekAgo;
    if (!document.getElementById('supTo').value) document.getElementById('supTo').value = today;
    document.getElementById('supGroupsChecks').innerHTML = (grps || []).map(g =>
      `<label style="display:flex;align-items:center;gap:4px;font-weight:normal;color:#111827;"><input type="checkbox" class="sup-grp" value="${g.id}" checked> ${g.name}</label>`
    ).join('');
  }

  async function calcSupply() {
    const from = document.getElementById('supFrom').value;
    const to = document.getElementById('supTo').value;
    const checkedGrps = Array.from(document.querySelectorAll('.sup-grp:checked')).map(c => c.value);
    const resDiv = document.getElementById('supplyResult');
    resDiv.innerHTML = 'Считаем потребность...';

    const orders = await req(`rest/v1/orders?created_at=gte.${from}T00:00:00&created_at=lte.${to}T23:59:59&order=created_at.desc`);
    const filtered = (orders || []).filter(o => !checkedGrps.length || checkedGrps.includes(o.group_id));

    const demand = {};
    filtered.forEach(o => {
      (o.items || []).forEach(it => {
        const w = (Number(it.weight_kg) || 0.5) * (Number(it.qty) || 1);
        demand[it.id] = (demand[it.id] || 0) + w;
      });
    });

    const rows = allProducts.map(p => {
      const ordKg = Number((demand[p.id] || 0).toFixed(3));
      const freeStock = Number(p.stock_kg) || 0;
      const boxKg = Number(p.box_weight_kg) || 5;
      const deficitKg = freeStock < 0 ? Math.abs(freeStock) : 0;
      const boxesToBuy = deficitKg > 0 ? Math.ceil(deficitKg / boxKg) : 0;
      const buyKg = Number((boxesToBuy * boxKg).toFixed(3));
      return { p, ordKg, freeStock, boxKg, deficitKg, boxesToBuy, buyKg };
    }).filter(r => r.ordKg > 0 || r.deficitKg > 0);

    if (!rows.length) {
      resDiv.innerHTML = '<div class="card">За выбранный период заказов по этим группам нет.</div>';
      lastSupplyText = '';
      return;
    }

    lastSupplyText = `Заказ поставщику (${from} — ${to}):\n` + rows
      .filter(r => r.boxesToBuy > 0)
      .map(r => `• ${r.p.name}: ${r.boxesToBuy} кор. (${r.buyKg} кг) [не хватает ${r.deficitKg} кг, кор. ${r.boxKg} кг]`)
      .join('\n');

    resDiv.innerHTML = rows.map(r => `
      <div class="card" style="border-left: 4px solid ${r.boxesToBuy > 0 ? '#dc2626' : '#2e7d32'};">
        <b>[${r.p.id}] ${r.p.name}</b> <small style="color:#6b7280;">(коробка: ${r.boxKg} кг)</small><br>
        <div style="font-size:13px; margin-top:4px;">
          Заказано за период: <b>${r.ordKg} кг</b> • Свободный остаток: <b>${r.freeStock} кг</b><br>
          ${r.boxesToBuy > 0
            ? `<span style="color:#dc2626; font-weight:700;">👉 Заказать: ${r.boxesToBuy} кор. = ${r.buyKg} кг</span> (дефицит ${r.deficitKg} кг)`
            : `<span style="color:#2e7d32;">✓ Хватает из наличия</span>`}
        </div>
      </div>`).join('');
  }

  function copySupply() {
    if (!lastSupplyText) return alert('Нет позиций для заказа поставщику (всего хватает на складе)');
    navigator.clipboard.writeText(lastSupplyText);
    alert('✅ Заявка скопирована в буфер обмена!');
  }

  if (jwt) showApp();
</script>
</body>
</html>
